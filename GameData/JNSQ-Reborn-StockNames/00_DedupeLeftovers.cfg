// Remove stock-named leftovers that JNSQ-Reborn replaces (:FINAL pass, applied before the rename).
// Generated by tools/generate.py of JNSQ-Reborn-StockNames. Do not edit by hand:
// re-run the generator against your JNSQ-Reborn install instead.
//
// Source: JNSQ-Reborn with 31 prefixed bodies.
// JNSQ-Reborn requires classic JNSQ to stay installed and relies on the fact that
// its stock-named configs (EVE eclipses, Scatterer atmospheres, Kerbal Konstructs
// sites, MechJeb sites, ...) as well as the stock EVE/Firefly ones point at bodies
// that no longer exist. Once the stock names come back those configs would load
// twice (classic + Reborn). This file deletes them while the Reborn copies still
// carry their JNSQ* names, so only the leftovers match. The result is exactly the
// set of configs a plain JNSQ-Reborn install ends up with.
//
// It runs in :FINAL, right before 01_StockNames.cfg (ModuleManager applies :FINAL
// patches in file order), so leftovers added by the late passes of other mods
// (:LAST[...], patch-style Scatterer configs, ...) are caught as well.

@EVE_CLOUDS:NEEDS[JNSQ-Reborn]:FINAL
